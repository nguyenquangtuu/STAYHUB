version: '3.8'

services:
  # 1. Dịch vụ Cơ sở dữ liệu MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: stayhub_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: stayhub_root_pwd
      MYSQL_DATABASE: stayhub_db
    ports:
      - "3306:3306"
    volumes:
      # Tự động nạp schema và seed data mẫu khi khởi tạo container lần đầu
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - stayhub_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pstayhub_root_pwd || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 2. Dịch vụ Backend RESTful API (Node.js Express)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stayhub_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: stayhub_root_pwd
      DB_NAME: stayhub_db
      JWT_SECRET: stayhub_super_secret_jwt_key_2026
      JWT_EXPIRES_IN: 7d

volumes:
  stayhub_mysql_data:
    driver: local

